name: windows-package

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest

      - name: Verify packaging configuration
        run: python -m pytest tests/test_windows_packaging.py

      - name: Build Windows portable package
        run: python -m PyInstaller jikeyan_photo_sorting.spec -y

      - name: Validate release layout
        run: python packaging/windows/check_release_layout.py --dist-dir dist/jikeyan-photo-sorting

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Check installer assets
        run: python packaging/windows/check_installer_assets.py

      - name: Build Windows installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/windows/installer.iss

      - name: Upload portable package artifact
        uses: actions/upload-artifact@v4
        with:
          name: jikeyan-photo-sorting-windows-portable
          path: dist/jikeyan-photo-sorting/
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: jikeyan-photo-sorting-windows-installer
          path: packaging/windows/output/Jikeyan-Photo-Sorting-Setup.exe
          if-no-files-found: error
